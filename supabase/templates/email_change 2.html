<h2>Confirm this address</h2>

<p>
  Follow this link to attach this address to your Press Start account.
  Everything you have already written stays yours — this only means you can
  reach it from another device.
</p>

<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next=/me"
    >Confirm this address</a
  >
</p>

<p>If you did not ask for this, nothing has happened and you can ignore it.</p>
